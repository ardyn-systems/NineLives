name: build

# Build downloadable installers whenever a version tag is pushed (e.g. v0.1.0),
# or manually from the Actions tab. hashcat + curated wordlists are fetched
# fresh at build time, so each release bundles the latest hashcat.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Run tests
        run: python -m pytest tests/ -q

  windows:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build (fetches hashcat + wordlists, PyInstaller, installer)
        shell: pwsh
        run: ./build_windows.ps1
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HashBench-Setup-windows
          path: dist/HashBench-Setup.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HashBench-Setup.exe

  linux:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y p7zip-full python3-gi gir1.2-webkit2-4.1
      - name: Build (fetches hashcat + wordlists, PyInstaller, tarball)
        run: bash build_linux.sh
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: HashBench-linux
          path: dist/HashBench-linux-x86_64.tar.gz
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HashBench-linux-x86_64.tar.gz
