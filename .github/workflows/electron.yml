# NineLives Electron build + release. On a v* tag this bundles the real hashcat,
# wordlists, and examples, builds the NSIS installer (Windows) + AppImage (Linux),
# smoke-tests the packaged app, and attaches the artifacts to the GitHub release.
# PRs / manual dispatch build without bundling vendor (packaging check only).
name: electron

on:
  workflow_dispatch:
    inputs:
      bundle_vendor:
        description: "Bundle real hashcat + wordlists (installable build)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "electron/**"
      - "webui/**"
      - "examples/**"
      - ".github/workflows/electron.yml"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: npm ci

      - name: Captures parity test (Node vs Python)
        run: node test/captures.test.js

      - name: Linux runtime libraries for Electron
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64 || sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2

      # Real hashcat + wordlists on tags (release) or when explicitly requested.
      - name: Bundle real vendor (hashcat + wordlists)
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.bundle_vendor }}
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y p7zip-full; fi
          python fetch_hashcat.py
          python fetch_wordlists.py

      - name: Stub vendor (packaging-only runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.bundle_vendor }}
        shell: bash
        run: mkdir -p ../vendor && echo stub > ../vendor/.placeholder

      - name: Build installer (electron-builder)
        run: npm run dist

      - name: Smoke-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:NINELIVES_SMOKE = "1"
          $p = Start-Process -FilePath dist\win-unpacked\ninelives.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "packaged smoke failed ($($p.ExitCode))" }

      - name: Smoke-test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          NINELIVES_SMOKE=1 xvfb-run -a dist/linux-unpacked/ninelives --smoke --no-sandbox
          code=$?
          echo "smoke exit=$code"
          exit $code

      - name: Checksums (Windows)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem dist\NineLives-Setup-*.exe |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File -Encoding ascii dist\SHA256SUMS-windows.txt

      - name: Checksums (Linux)
        if: startsWith(github.ref, 'refs/tags/') && runner.os == 'Linux'
        run: |
          cd dist && sha256sum NineLives-*-x86_64.AppImage > SHA256SUMS-linux.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Auto-generate "What's Changed" notes from the merged PRs/commits since
          # the previous tag. These show on the Releases page AND in the in-app
          # update wizard (which reads each release's body from the GitHub API).
          generate_release_notes: true
          files: |
            electron/dist/NineLives-Setup-*.exe
            electron/dist/NineLives-*-x86_64.AppImage
            electron/dist/SHA256SUMS-*.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ninelives-electron-${{ matrix.os }}
          path: |
            electron/dist/NineLives-Setup-*.exe
            electron/dist/*.AppImage
          if-no-files-found: warn
